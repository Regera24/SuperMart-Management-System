version: '3.8'

# ═══════════════════════════════════════════════════════════════
#  SuperMart Management System — Docker Compose (Full Stack)
#  Start: docker compose up -d
#  Tip: Run databases + infra first, then start services
# ═══════════════════════════════════════════════════════════════

x-common-env: &common-env
  EUREKA_URL: http://eureka-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: T7EOnmBnmqvRABNZf9TsmuHLyFmauuAV66Nd8OdaTlFLBTocK2nH0NKIcwLpjJAosgGs8tV2BuuIQ2doKjiFfA==

services:

  # ─────────────────────────── INFRASTRUCTURE ────────────────────

  # Kafka (KRaft mode — no Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: smms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'smms-kafka-cluster-001'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smms-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smms-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # PostgreSQL — shared for identity, order, report, staff services
  postgres:
    image: postgres:16-alpine
    container_name: smms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_MULTIPLE_DATABASES: smms_identity_service,smms_order_service,smms_report_service,smms_staff_service
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB — notification + product + inventory + customer
  mongo:
    image: mongo:7.0
    container_name: smms-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "12345"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL — (reserved for future services; currently unused)
  mysql:
    image: mysql:8.3
    container_name: smms-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: smms_mysql
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────── SERVICE REGISTRY ──────────────────

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: smms-eureka
    image: smms/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ─────────────────────────── API GATEWAY ───────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: smms-api-gateway
    image: smms/api-gateway:latest
    ports:
      - "8888:8888"
    environment:
      <<: *common-env
    depends_on:
      eureka-server:
        condition: service_healthy

  # ─────────────────────────── MICROSERVICES ─────────────────────

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: smms-identity
    image: smms/identity-service:latest
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/smms_identity_service
      DB_USER: postgres
      DB_PASSWORD: "12345"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: smms-product
    image: smms/product-service:latest
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      MONGO_URI: mongodb://root:12345@mongo:27017/smms_product_service?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: smms-inventory
    image: smms/inventory-service:latest
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      MONGO_URI: mongodb://root:12345@mongo:27017/smms_inventory_service?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: smms-order
    image: smms/order-service:latest
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/smms_order_service
      DB_USER: postgres
      DB_PASSWORD: "12345"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: smms-customer
    image: smms/customer-service:latest
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      MONGO_URI: mongodb://root:12345@mongo:27017/smms_customer_service?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  staff-service:
    build:
      context: ./staff-service
      dockerfile: Dockerfile
    container_name: smms-staff
    image: smms/staff-service:latest
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/smms_staff_service
      DB_USER: postgres
      DB_PASSWORD: "12345"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: smms-notification
    image: smms/notification-service:latest
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      MONGO_URI: mongodb://root:12345@mongo:27017/smms_notification_service?authSource=admin
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@supermart.vn}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: smms-report
    image: smms/report-service:latest
    ports:
      - "8088:8088"
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/smms_report_service
      DB_USER: postgres
      DB_PASSWORD: "12345"
    volumes:
      - report-files:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

# ─────────────────────────── VOLUMES ───────────────────────────

volumes:
  kafka-data:
  postgres-data:
  mongo-data:
  mysql-data:
  report-files:
